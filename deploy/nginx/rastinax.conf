# Rastinax AI Agent
# Public address: http://195.177.255.98
#
# Expected local services:
#   Client  -> 127.0.0.1:3000
#   Django  -> 127.0.0.1:8001
#   AI      -> 127.0.0.1:8000 (internal; never proxy this directly)

upstream rastinax_client {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream rastinax_backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 195.177.255.98 _;

    client_max_body_size 20m;

    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx"}';
    }

    # Django REST API, OpenAPI, Swagger, and ReDoc.
    # No trailing slash is intentional: the original request URI is preserved.
    location /api/ {
        proxy_pass http://rastinax_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_redirect off;
    }

    # Django admin.
    location /admin/ {
        proxy_pass http://rastinax_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # Change this path if the project is deployed somewhere other than
    # /var/www/rastinax-agent.
    location /static/ {
        alias /var/www/rastinax-agent/Server/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # React Router SSR client.
    location / {
        proxy_pass http://rastinax_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
